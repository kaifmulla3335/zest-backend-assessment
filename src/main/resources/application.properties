spring.application.name=product-api

# --- Database connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_management_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET:ThisIsALocalDevSecretKeyForJwtSigningChangeInProdEnv123456789}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000